<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b8ef7"/>
      <stop offset="1" stop-color="#1b48a8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecf9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#071d4d" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- macOS-style squircle, inset so the system doesn't clip it -->
  <path d="M512 72
           C 792 72 952 232 952 512
           C 952 792 792 952 512 952
           C 232 952 72 792 72 512
           C 72 232 232 72 512 72 Z"
        fill="url(#bg)"/>

  <!-- the two source cards, fanned out at the top -->
  <g filter="url(#shadow)">
    <rect x="192" y="190" width="280" height="190" rx="36" fill="#ffffff"
          transform="rotate(-9 332 285)"/>
    <rect x="552" y="190" width="280" height="190" rx="36" fill="#ffffff"
          transform="rotate(9 692 285)"/>
  </g>
  <!-- one field line on each source card -->
  <rect x="236" y="254" width="140" height="30" rx="15" fill="#2f6fdb" transform="rotate(-9 332 285)"/>
  <rect x="648" y="254" width="140" height="30" rx="15" fill="#2f6fdb" transform="rotate(9 692 285)"/>

  <!-- the merge: two branches meeting, then one trunk -->
  <path d="M 336 396 Q 390 560 512 560 Q 634 560 688 396
           M 512 560 L 512 626"
        fill="none" stroke="#ffffff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the merged card -->
  <g filter="url(#shadow)">
    <rect x="262" y="612" width="500" height="256" rx="44" fill="url(#card)"/>
  </g>
  <rect x="326" y="688" width="250" height="40" rx="20" fill="#2f6fdb"/>
  <rect x="326" y="766" width="372" height="30" rx="15" fill="#b3c2e6"/>
</svg>
